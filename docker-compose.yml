services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: f1
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      # I file in questa cartella vengono eseguiti automaticamente,
      # in ordine alfabetico, SOLO al primo avvio (volume vuoto).
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: f1
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  db_data:
